name: Release
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          # Node 20 went EOL 2026-04-30 and npm dropped it: npm@12's engines are
          # `^22.22.2 || ^24.15.0 || >=26.0.0`, so `npm install -g` below exits
          # EBADENGINE (verified exit 1) and fails the job before publish. 24 is
          # active LTS and ships npm 11.16, already over the OIDC floor.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Runs before any install work so a mismatch costs seconds, not a build.
      # Without it the tag only selects the *commit*, never the version — npm
      # publishes whatever package.json says, so tagging v1.2.9 on a tree still
      # reading 1.2.8 republishes 1.2.8 (or dies on "already exists") while the
      # tag, and the --provenance attestation bound to it, claim otherwise. That
      # corrupts the one thing provenance exists to assert. GITHUB_REF_NAME is
      # read as an env var, not interpolated into the script, so the tag name is
      # never executable. The floating `v1` tag never reaches here: the trigger
      # pattern needs two literal dots and `v1` has none (measured, see STATE).
      - name: Verify tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=$tag package.json=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag does not match package.json version $pkg"; exit 1; }
      # Floor-pinned, NOT @latest: the requirement is a minimum (OIDC trusted
      # publishing needs npm >= 11.5.1), and `@latest` silently resolves to the
      # next npm major, which is free to drop this runner's Node line — exactly
      # how this step broke on Node 20. Pin the floor; never chase the tip.
      - run: npm install -g npm@^11
      # Job-level `id-token: write` means the OIDC minting endpoint is reachable
      # during install; --ignore-scripts keeps third-party install scripts away
      # from it. Free here: esbuild resolves via its @esbuild/linux-x64 prebuilt
      # (build verified byte-identical by sha256), fsevents is darwin-only. A
      # future native dep without a linux prebuilt will fail this step loudly —
      # the fix then is splitting install (no id-token) from publish, not
      # dropping the flag.
      - run: npm ci --ignore-scripts
      # The tag guard above closes tag -> package.json, but package.json ->
      # src/utils/version.ts is asserted only by tests/version.test.ts, which
      # runs in ci.yml on branch pushes — not here. Nothing stops tagging a
      # commit whose CI was red or never ran, so without this the tarball can
      # ship a runtime VERSION that disagrees with the version it published
      # under. That is not hypothetical: v1.2.8 shipped exactly that desync and
      # needed v1.2.9 to repair it. Runs against the installed tree, so it also
      # catches a dep bump that breaks the build under --ignore-scripts.
      - run: npm test
      - run: npm publish --provenance --access public

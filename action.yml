name: 'ctxlens Context Check'
description: 'Verify your codebase fits within AI model context windows'
branding:
  icon: 'aperture'
  color: 'purple'

inputs:
  model:
    # Deliberately empty, NOT the CLI's current default ID. This action installs
    # ctxlens from npm, so a hardcoded ID here has to match whatever version the
    # registry serves at run time — and it won't during the window between
    # retiring a model in this repo and publishing the release that ships it.
    # Measured 2026-07-29: defaulting this to `claude-sonnet-5` while npm still
    # served 1.2.7 made the step exit 1 with "Unknown model", breaking this
    # repo's own `uses: ./` PR check before any release existed. Empty means
    # "don't pass --model", so the installed CLI applies its own default and the
    # two can never disagree.
    description: 'Target model for budget calculation (default: the installed CLI''s own default)'
    required: false
    default: ''
  threshold:
    description: 'Fail if utilization exceeds this percentage'
    required: false
    default: '100'
  path:
    description: 'Directory to scan'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '18'
    - name: Install ctxlens
      shell: bash
      run: npm install -g ctxlens@latest
    - name: Run token budget check
      shell: bash
      # Inputs travel via env, never interpolated into the script body: `${{ }}`
      # expands before bash parses, so a caller-supplied value containing shell
      # metacharacters would execute. Deliberately NOT named CTXLENS_MODEL — the
      # CLI reads that as its own override, so an empty one would outrank the
      # user's .ctxlensrc.
      env:
        CTXLENS_INPUT_PATH: ${{ inputs.path }}
        CTXLENS_INPUT_MODEL: ${{ inputs.model }}
        CTXLENS_INPUT_THRESHOLD: ${{ inputs.threshold }}
      run: |
        args=(scan "$CTXLENS_INPUT_PATH" --ci "$CTXLENS_INPUT_THRESHOLD")
        [ -n "$CTXLENS_INPUT_MODEL" ] && args+=(--model "$CTXLENS_INPUT_MODEL")
        ctxlens "${args[@]}"
